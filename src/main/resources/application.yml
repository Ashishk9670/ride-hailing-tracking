spring:
  application:
    name: ride-hailing-tracking
  datasource:
    url: jdbc:postgresql://localhost:5432/rides
    username: rides
    password: rides
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        linger.ms: 5
    consumer:
      group-id: location-ingest
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # poison pills are captured (not an infinite redelivery loop) and dead-lettered by the error handler
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.example.ridehailing.dto.LocationUpdate
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.example.ridehailing.dto
    listener:
      concurrency: 3
      observation-enabled: true
    template:
      observation-enabled: true
  graphql:
    graphiql:
      enabled: true
    websocket:
      path: /graphql

server:
  port: 8080

ridehailing:
  topics:
    driver-locations: driver-locations
    partitions: 3
  redis:
    geo-key: drivers:available
    dispatch-channel: dispatch-events
    last-seen-key: drivers:last-seen
    driver-ttl-seconds: ${DRIVER_TTL_SECONDS:30}
    sweep-interval-ms: 5000
  matching:
    radius-km: 5
    max-candidates: 5
  retry:
    max-attempts: 4
    initial-interval-ms: 200
    multiplier: 2.0
    max-interval-ms: 2000
