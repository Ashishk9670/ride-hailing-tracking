<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Trip Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; display: flex; height: 100vh; }
  #panel { width: 300px; padding: 12px; box-sizing: border-box; overflow-y: auto; border-right: 1px solid #ccc; }
  #map { flex: 1; }
  button { margin: 2px 0; width: 100%; padding: 6px; }
  #log { font: 11px monospace; max-height: 200px; overflow-y: auto; background: #f6f6f6; padding: 4px; }
  dt { font-weight: bold; } dd { margin: 0 0 6px; }
</style>
</head>
<body>
<div id="panel">
  <h3>Live Trip Tracking</h3>
  <fieldset id="auth" style="margin:0 0 8px">
    <legend>Sign in</legend>
    <select id="login-role" style="width:100%">
      <option value="operator">operator (RIDER + ADMIN)</option>
      <option value="rider">rider (RIDER)</option>
    </select>
    <button id="btn-login">Sign in</button>
    <div id="auth-state">signed out</div>
  </fieldset>
  <button id="btn-sim">Start simulator (10 drivers)</button>
  <button id="btn-request">Request ride (pickup = map center)</button>
  <label>Trip ID <input id="trip-id" style="width:100%" placeholder="trip id"></label>
  <button id="btn-track">Track trip</button>
  <button id="btn-arrived">Driver arrived</button>
  <button id="btn-start">Start trip</button>
  <button id="btn-complete">Complete trip</button>
  <fieldset id="replay" style="margin:6px 0">
    <legend>Replay stored route</legend>
    <select id="replay-speed" style="width:100%">
      <option value="1">1x</option><option value="2">2x</option><option value="5">5x</option>
      <option value="10">10x</option><option value="50">50x</option>
    </select>
    <button id="btn-replay">Replay trip</button>
    <button id="btn-replay-stop">Stop replay</button>
    <div>State: <span id="replay-state">idle</span>, points: <span id="replay-count">0</span></div>
  </fieldset>
  <dl>
    <dt>Connection</dt><dd id="conn">idle</dd>
    <dt>Trip status</dt><dd id="trip-status">-</dd>
    <dt>Driver</dt><dd id="driver-id">-</dd>
    <dt>Position</dt><dd id="position">-</dd>
    <dt>Updates received</dt><dd id="update-count">0</dd>
  </dl>
  <div id="log"></div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER = [37.7749, -122.4194];
const map = L.map('map').setView(CENTER, 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap'}).addTo(map);
let marker = null, ws = null, count = 0, pickupMarker = null, token = null;
const USER = 'ui-rider';
const $ = id => document.getElementById(id);
const log = m => { const d = document.createElement('div'); d.textContent = m; $('log').prepend(d); };

async function api(method, path, body) {
  const headers = {'Content-Type': 'application/json'};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  if (!r.ok) { log(method + ' ' + path + ' -> ' + r.status); return null; }
  const t = await r.text(); return t ? JSON.parse(t) : {};
}

function setStatus(t) { $('trip-status').textContent = t.status; if (t.driverId) $('driver-id').textContent = t.driverId; }

function track(id) {
  if (ws) ws.close();
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws/trips/' + id + '?access_token=' + encodeURIComponent(token || ''));
  ws.onopen = () => { $('conn').textContent = 'connected'; };
  ws.onclose = () => { $('conn').textContent = 'closed'; };
  ws.onmessage = ev => {
    const f = JSON.parse(ev.data);
    if (f.kind === 'location') {
      const p = f.data; const ll = [p.lat, p.lon];
      if (!marker) marker = L.marker(ll).addTo(map); else marker.setLatLng(ll);
      map.panTo(ll);
      $('position').textContent = p.lat.toFixed(5) + ', ' + p.lon.toFixed(5);
      $('driver-id').textContent = p.driverId;
      $('update-count').textContent = ++count;
    } else if (f.kind === 'event') {
      if (f.data.status) $('trip-status').textContent = f.data.status;
      log('event ' + f.data.type);
    }
  };
}

$('btn-login').onclick = async () => {
  const roles = $('login-role').value === 'operator' ? ['RIDER', 'ADMIN'] : ['RIDER'];
  const r = await api('POST', '/api/auth/token', {subject: USER, roles});
  if (!r) { $('auth-state').textContent = 'sign-in failed'; return; }
  token = r.accessToken;
  $('auth-state').textContent = 'signed in as ' + USER + ' [' + roles.join(',') + ']';
};
$('btn-sim').onclick = async () => { const r = await api('POST', '/api/simulator/start?count=10&lat=' + CENTER[0] + '&lon=' + CENTER[1] + '&intervalMs=500'); log('simulator ' + JSON.stringify(r)); };
$('btn-request').onclick = async () => {
  const c = map.getCenter();
  const t = await api('POST', '/api/rides', {riderId: USER, pickupLat: c.lat, pickupLon: c.lng, dropoffLat: c.lat + 0.01, dropoffLon: c.lng + 0.01});
  if (!t) return;
  $('trip-id').value = t.id; setStatus(t);
  if (pickupMarker) pickupMarker.remove();
  pickupMarker = L.circleMarker([c.lat, c.lng], {radius: 8, color: 'green'}).addTo(map);
  track(t.id);
};
let replayAbort = null, replayMarker = null, replayTrail = null;
function stopReplay(state) {
  if (replayAbort) { replayAbort.abort(); replayAbort = null; }
  if (state) $('replay-state').textContent = state;
}
$('btn-replay-stop').onclick = () => stopReplay('stopped');
$('btn-replay').onclick = async () => {
  const id = $('trip-id').value.trim();
  if (!id) { log('replay: no trip id'); return; }
  stopReplay();
  if (replayMarker) { replayMarker.remove(); replayMarker = null; }
  if (replayTrail) { replayTrail.remove(); }
  replayTrail = L.polyline([], {color: 'orange', className: 'replay-trail'}).addTo(map);
  $('replay-count').textContent = '0';
  $('replay-state').textContent = 'loading';
  const ctl = new AbortController(); replayAbort = ctl;
  const headers = {}; if (token) headers['Authorization'] = 'Bearer ' + token;
  try {
    const r = await fetch('/api/trips/' + id + '/replay?speed=' + $('replay-speed').value, {headers, signal: ctl.signal});
    if (!r.ok) { log('GET replay -> ' + r.status); $('replay-state').textContent = 'error'; return; }
    $('replay-state').textContent = 'playing';
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = '', n = 0;
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        let name = 'message', data = '';
        for (const line of block.split('\n')) {
          if (line.startsWith('event:')) name = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (name === 'point') {
          const p = JSON.parse(data), ll = [p.lat, p.lon];
          if (!replayMarker) replayMarker = L.circleMarker(ll, {radius: 9, color: 'orange', className: 'replay-marker'}).addTo(map);
          else replayMarker.setLatLng(ll);
          replayTrail.addLatLng(ll); map.panTo(ll);
          $('replay-count').textContent = ++n;
        } else if (name === 'done') { $('replay-state').textContent = 'finished'; }
      }
    }
    if ($('replay-state').textContent === 'playing') $('replay-state').textContent = 'finished';
  } catch (e) {
    if (e.name !== 'AbortError') { log('replay failed: ' + e); $('replay-state').textContent = 'error'; }
  }
};
$('btn-track').onclick = () => track($('trip-id').value.trim());
const setTo = s => async () => { const t = await api('PATCH', '/api/trips/' + $('trip-id').value.trim() + '/status', {status: s}); if (t) setStatus(t); };
$('btn-arrived').onclick = setTo('DRIVER_ARRIVED');
$('btn-start').onclick = setTo('IN_PROGRESS');
$('btn-complete').onclick = setTo('COMPLETED');
</script>
</body>
</html>
