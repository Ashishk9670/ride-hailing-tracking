services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: rides
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rides -d rides"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:3.8.0   # single-node KRaft broker, advertised on localhost:9092
    ports: ["9092:9092"]
volumes:
  pgdata:
