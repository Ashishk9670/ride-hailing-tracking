apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # app log pattern is "[ride-hailing-tracking,<traceId>,<spanId>] ": jump from a log line to its trace
      derivedFields:
        - name: TraceID
          matcherRegex: '\[ride-hailing-tracking,([0-9a-f]{32}),'
          url: '$${__value.raw}'
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        customQuery: true
        query: '{service="app"} |= "$${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
