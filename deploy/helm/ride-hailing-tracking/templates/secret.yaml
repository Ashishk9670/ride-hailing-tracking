{{- if .Values.secret.create }}
# Dev/test convenience only. Use External Secrets / Sealed Secrets in real clusters (see deploy/examples).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rht.fullname" . }}
  labels: {{- include "rht.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
