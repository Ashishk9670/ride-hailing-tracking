# Bitnami Sealed Secrets: the encryptedData values below are PLACEHOLDERS, not real ciphertext.
# Generate real ones against your cluster's public cert:
#   kubectl create secret generic ride-hailing-secrets -n ride-hailing --dry-run=client \
#     --from-literal=SPRING_DATASOURCE_USERNAME=... --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --from-literal=RIDEHAILING_JWT_SECRET=... -o yaml | kubeseal --format yaml > sealed-secret.yaml
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ride-hailing-secrets
  namespace: ride-hailing
spec:
  encryptedData:
    SPRING_DATASOURCE_USERNAME: AgBPLACEHOLDER-replace-with-kubeseal-output
    SPRING_DATASOURCE_PASSWORD: AgBPLACEHOLDER-replace-with-kubeseal-output
    RIDEHAILING_JWT_SECRET: AgBPLACEHOLDER-replace-with-kubeseal-output
  template:
    metadata:
      name: ride-hailing-secrets
      namespace: ride-hailing
    type: Opaque
