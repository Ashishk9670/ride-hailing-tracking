# External Secrets Operator: syncs the app secret from a cloud secret manager. No secret values live in git.
# Requires the External Secrets Operator and a (Cluster)SecretStore named `aws-secrets-manager`.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ride-hailing-secrets
  namespace: ride-hailing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ride-hailing-secrets   # = Helm value secret.existingSecret
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef: { key: ride-hailing/prod/db, property: username }
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef: { key: ride-hailing/prod/db, property: password }
    - secretKey: RIDEHAILING_JWT_SECRET
      remoteRef: { key: ride-hailing/prod/jwt, property: secret }
