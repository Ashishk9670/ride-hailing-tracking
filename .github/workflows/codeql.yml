name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: github/codeql-action/init@v3
        with: { languages: java-kotlin, build-mode: manual }
      - run: mvn -B -ntp -DskipTests package
      # Code scanning upload needs GitHub Advanced Security on private repos; keep results as an artifact instead.
      # Remove `upload: never` / `output` and the artifact step if the repo becomes public or GHAS is enabled.
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@v4
        with: { name: codeql-sarif, path: codeql-results }
