name: Mutation testing

# Optional, slow job: not part of the PR gate.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: PIT on geo matching, surge, ETA and trip state machine
        run: |
          THRESHOLD=$(tr -d '[:space:]' < .github/pit-threshold)
          mvn -B -ntp -Pmutation -Dpit.threshold="$THRESHOLD" test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Mutation score summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, collections
          try:
              root = ET.parse('target/pit-reports/mutations.xml').getroot()
          except Exception as e:
              print('no report:', e); raise SystemExit
          per = collections.defaultdict(lambda: [0, 0])
          for m in root.iter('mutation'):
              c = m.findtext('mutatedClass').split('.')[-1]
              per[c][1] += 1
              if m.get('status') == 'KILLED': per[c][0] += 1
          k = sum(v[0] for v in per.values()); t = sum(v[1] for v in per.values())
          print('### Mutation score: %d/%d = %.1f%%' % (k, t, 100.0 * k / max(t, 1)))
          print('| class | killed | total | score |\n|---|---|---|---|')
          for c, (a, b) in sorted(per.items()):
              print('| %s | %d | %d | %.1f%% |' % (c, a, b, 100.0 * a / max(b, 1)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pit-report, path: target/pit-reports }
