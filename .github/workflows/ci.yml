name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and unit tests
        run: mvn -B -ntp test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: unit-reports, path: target/surefire-reports }

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Unit + integration tests (Testcontainers) with Jacoco
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-reports
          path: |
            target/site/jacoco
            target/surefire-reports
            target/failsafe-reports

  e2e:
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Package app
        run: mvn -B -ntp -DskipTests package
      - name: Start app
        run: |
          nohup java -jar target/ride-hailing-tracking-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            app.log
      - name: Tear down
        if: always()
        run: docker compose down -v
